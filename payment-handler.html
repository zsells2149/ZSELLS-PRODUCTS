<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Handler</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: linear-gradient(135deg, #ff005b 0%, #ff5e00 100%);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .payment-method {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .method {
            flex: 1;
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: transform 0.3s;
        }
        .method:hover {
            transform: scale(1.05);
        }
        .method img {
            width: 60px;
            margin-bottom: 10px;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            margin: 20px 0;
        }
        input[type='number'] {
            padding: 10px;
            border: none;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .security-badge {
            text-align: center;
            margin: 20px 0;
        }
        .security-badge img {
            width: 100px;
        }
        @media (max-width: 600px) {
            .payment-method {
                flex-direction: column;
            }
            .method {
                margin-bottom: 10px;
                margin-left: 0;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <h1>Secure Payment</h1>
    <div class="container">
        <div class="payment-method">
            <div class="method">
                <img src="https://example.com/visa-icon.png" alt="Visa">
                <p>Visa</p>
            </div>
            <div class="method">
                <img src="https://example.com/mastercard-icon.png" alt="MasterCard">
                <p>MasterCard</p>
            </div>
            <div class="method">
                <img src="https://example.com/paypal-icon.png" alt="PayPal">
                <p>PayPal</p>
            </div>
        </div>
        <div class="input-section">
            <label for="amount">Enter Amount:</label>
            <input type="number" id="amount" placeholder="Amount" />
        </div>
        <div class="security-badge">
            <img src="https://example.com/security-badge.png" alt="Security Badge">
        </div>
    </div>
</body>
</html>
