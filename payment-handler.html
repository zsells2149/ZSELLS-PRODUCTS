<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Payment Form</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5);
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .payment-methods {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .payment-card {
            background: linear-gradient(145deg, #3e3e3e, #2a2a2a);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .payment-card:hover {
            box-shadow: 0 0 20px hotpink;
        }
        .payment-card img {
            width: 30px;
            vertical-align: middle;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 5px hotpink;
        }
        .submit-btn {
            background: linear-gradient(45deg, hotpink, deepPink);
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px hotpink;
        }
        .security-badge {
            display: block;
            margin: 10px auto;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Premium Payment Form</h1>
        <div class="payment-methods">
            <div class="payment-card">
                <img src="visa-icon.png" alt="Visa"> Visa
            </div>
            <div class="payment-card">
                <img src="mastercard-icon.png" alt="Mastercard"> Mastercard
            </div>
            <div class="payment-card">
                <img src="paypal-icon.png" alt="PayPal"> PayPal
            </div>
        </div>
        <form>
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
            </div>
            <div class="form-group">
                <label for="expiry-date">Expiry Date</label>
                <input type="text" id="expiry-date" placeholder="MM/YY" required>
            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123" required>
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter Amount" required>
            </div>
            <button type="submit" class="submit-btn">Pay Now</button>
        </form>
        <span class="security-badge">🔒 Secure Payment</span>
    </div>
</body>
</html>
