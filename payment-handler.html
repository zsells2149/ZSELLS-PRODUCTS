<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Payment Handler</title>\n</head>\n<body>\n    <h1>Unified Payment Form</h1>\n    <form action="#" method="POST">\n        <label for="amount">Amount:</label>\n        <input type="text" id="amount" name="amount" required>\n        <br>\n        <h2>Select Payment Method:</h2>\n        <div>\n            <input type="radio" id="applepay" name="payment-method" value="applepay">\n            <label for="applepay">Apple Pay</label>\n        </div>\n        <div>\n            <input type="radio" id="googlepay" name="payment-method" value="googlepay">\n            <label for="googlepay">Google Pay</label>\n        </div>\n        <div>\n            <input type="radio" id="cashapp" name="payment-method" value="cashapp">\n            <label for="cashapp">Cash App</label>\n        </div>\n        <div>\n            <input type="radio" id="paypal" name="payment-method" value="paypal">\n            <label for="paypal">PayPal</label>\n        </div>\n        <div>\n            <input type="radio" id="card" name="payment-method" value="card">\n            <label for="card">Credit/Debit Card</label>\n        </div>\n        <br>\n        <button type="submit">Pay</button>\n    </form>\n</body>\n</html>
